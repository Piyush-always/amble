# Amble Beats order API. See README.md for first-time setup.
name = "amble-api"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[observability]
enabled = true

[vars]
# Razorpay key id is public (it is sent to the browser). Use the rzp_test_ key until the test run passes.
RAZORPAY_KEY_ID = "rzp_live_ScIUXsDV3PFdCx"
# Sites allowed to call the API. Add http://localhost:8080 only while testing locally.
ALLOWED_ORIGINS = "https://amble.invengic.in"
# Where order and enquiry notifications go (comma-separated), and the sender (a domain verified in Resend).
NOTIFY_EMAIL = "sales@invengic.in"
MAIL_FROM = "Amble Beats <orders@invengic.in>"

# Secrets are never written here. Set them with:
#   npx wrangler secret put RAZORPAY_KEY_SECRET
#   npx wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   npx wrangler secret put RESEND_API_KEY        (optional: without it no emails are sent)

[[d1_databases]]
binding = "DB"
database_name = "amble-orders"
database_id = "7572ddd0-9c78-40a7-b39a-03fa73a0ab58"
